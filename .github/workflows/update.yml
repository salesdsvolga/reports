name: Обновить отчёты

on:
  schedule:
    # Время по UTC. Самара = UTC+4, поэтому 06:15 UTC = 10:15 в Самаре.
    - cron: '15 6 * * 1-5'   # 10:15 Самара, Пн–Пт
  push:                       # правка планов (plans.json) — страницы пересобираются сразу
    branches: [main]
    paths:
      - plans.json
  workflow_dispatch:          # кнопка «Run workflow»; так же workflow запускает 1С после выгрузки
    inputs:
      force_tips:
        description: 'Пересоздать сегодняшние советы (обычно они готовятся раз в день)'
        type: boolean
        default: false

permissions:
  contents: write   # журнал советов хранится в релизе tips-state
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # --- Советы: журнал (что уже советовали) ---
      # Журнал зашифрован паролем выгрузки (EXPORT_PASSWORD) и лежит в релизе tips-state.
      - name: Скачать журнал советов
        continue-on-error: true
        run: |
          mkdir -p .tips
          gh release download tips-state --pattern tips-state.enc --dir .tips || echo "Журнала ещё нет — начнём новый."
        env:
          GH_TOKEN: ${{ github.token }}

      # --- Шаг 1: прямая выгрузка из 1С ---
      # 1С (обработка «Выгрузка для портала») кладёт зашифрованный архив export.zip
      # в релиз data-export этого репозитория. Пароль архива — секрет EXPORT_PASSWORD.
      - name: Скачать выгрузку 1С
        id: export_dl
        continue-on-error: true
        run: |
          rm -rf .export && mkdir -p .export
          gh release download data-export --pattern export.zip --dir .export
          7z x -y -p"$EXPORT_PASSWORD" -o.export .export/export.zip > /dev/null
          test -s .export/export.json
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_PASSWORD: ${{ secrets.EXPORT_PASSWORD }}

      - name: Собрать из выгрузки 1С
        id: export
        if: steps.export_dl.outcome == 'success'
        continue-on-error: true
        run: node src/build.js --source=export:.export/export.json --encrypt --tips
        env:
          PASSWORDS: ${{ secrets.PASSWORDS }}
          PLANS_JSON: ${{ vars.PLANS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TIPS_STATE_FILE: .tips/tips-state.enc
          TIPS_STATE_KEY: ${{ secrets.EXPORT_PASSWORD }}
          TIPS_FORCE: ${{ inputs.force_tips && '1' || '' }}

      # --- Шаг 2 (резерв): письмо 1С в Gmail ---
      - name: Попробовать Gmail
        id: gmail
        if: steps.export.outcome != 'success'
        continue-on-error: true
        run: node src/build.js --source=mail --encrypt --tips
        env:
          MAIL_HOST: 'imap.gmail.com'
          MAIL_FOLDER: 'INBOX'
          MAIL_USER: ${{ secrets.GMAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
          PLANS_JSON: ${{ vars.PLANS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TIPS_STATE_FILE: .tips/tips-state.enc
          TIPS_STATE_KEY: ${{ secrets.EXPORT_PASSWORD }}
          TIPS_FORCE: ${{ inputs.force_tips && '1' || '' }}

      # --- Шаг 3 (резерв): если и Gmail не дал свежих данных — Яндекс ---
      - name: Попробовать Яндекс (резерв)
        id: yandex
        if: steps.export.outcome != 'success' && steps.gmail.outcome == 'failure'
        continue-on-error: true
        run: node src/build.js --source=mail --encrypt --tips
        env:
          MAIL_HOST: 'imap.yandex.ru'
          MAIL_FOLDER: 'Отчёты'
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
          PLANS_JSON: ${{ vars.PLANS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TIPS_STATE_FILE: .tips/tips-state.enc
          TIPS_STATE_KEY: ${{ secrets.EXPORT_PASSWORD }}
          TIPS_FORCE: ${{ inputs.force_tips && '1' || '' }}

      # --- Шаг 4: если ни один источник не дал данных — валим workflow ---
      - name: Проверить, что сборка удалась
        if: steps.export.outcome != 'success' && steps.gmail.outcome == 'failure' && steps.yandex.outcome == 'failure'
        run: |
          echo "❌ Ни один источник не дал свежих данных."
          echo "   Выгрузка 1С: ${{ steps.export_dl.outcome }} / ${{ steps.export.outcome }}"
          echo "   Gmail:       ${{ steps.gmail.outcome }}"
          echo "   Яндекс:      ${{ steps.yandex.outcome }}"
          echo "Проверьте регламентное задание выгрузки в 1С и письма рассылки «123»."
          exit 1

      - name: Сохранить журнал советов
        continue-on-error: true
        run: |
          [ -f .tips/tips-state.enc ] || { echo "Журнал не создавался."; exit 0; }
          gh release view tips-state > /dev/null 2>&1 || gh release create tips-state --title "Журнал советов" --notes "Служебный файл: какие советы уже показывали (зашифрован). Не удалять." --latest=false
          gh release upload tips-state .tips/tips-state.enc --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Источник данных
        run: |
          if [ "${{ steps.export.outcome }}" = "success" ]; then echo "✅ Отчёты собраны из прямой выгрузки 1С."; else echo "↩️ Отчёты собраны из письма (резерв)."; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
