name: Обновить отчёты

on:
  schedule:
    # Время по UTC. Самара = UTC+4, поэтому 06:15 UTC = 10:15 в Самаре.
    - cron: '15 6 * * 1-5'   # 10:15 Самара, Пн–Пт
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # --- Шаг 1: пробуем собрать из Gmail ---
      - name: Попробовать Gmail
        id: gmail
        continue-on-error: true
        run: node src/build.js --source=mail --encrypt --tips
        env:
          MAIL_HOST: 'imap.gmail.com'
          MAIL_FOLDER: 'INBOX'
          MAIL_USER: ${{ secrets.GMAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
          PLANS_JSON: ${{ vars.PLANS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      # --- Шаг 2: если Gmail не дал свежих данных — пробуем Яндекс ---
      # Условие: шаг 1 завершился с ошибкой (нет письма, письмо старое,
      # сервер лежит, папки нет — любая причина).
      - name: Попробовать Яндекс (резерв)
        id: yandex
        if: steps.gmail.outcome == 'failure'
        continue-on-error: true
        run: node src/build.js --source=mail --encrypt --tips
        env:
          MAIL_HOST: 'imap.yandex.ru'
          MAIL_FOLDER: 'Отчёты'
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
          PLANS_JSON: ${{ vars.PLANS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

      # --- Шаг 3: если оба источника не дали данных — валим workflow ---
      - name: Проверить, что сборка удалась
        if: steps.gmail.outcome == 'failure' && steps.yandex.outcome == 'failure'
        run: |
          echo "❌ Обе почты не дали свежих данных."
          echo "   Gmail:  ${{ steps.gmail.outcome }}"
          echo "   Яндекс: ${{ steps.yandex.outcome }}"
          echo "Проверьте, отправила ли 1С отчёты, и доходят ли письма до обеих почт."
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
