name: Обновить отчёты

on:
  schedule:
    # Время по UTC. Самара = UTC+4, поэтому 06:15 UTC = 10:15 в Самаре.
    - cron: '15 6 * * 1-5'   # 10:15 Самара, Пн–Пт
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # --- Шаг 1: проверяем, доступна ли Яндекс.Почта ---
      - name: Проверить доступность Яндекс.Почты
        id: check_yandex
        continue-on-error: true
        run: |
          node -e "
            const { ImapFlow } = require('imapflow');
            const client = new ImapFlow({
              host: 'imap.yandex.ru',
              port: 993,
              secure: true,
              auth: { user: process.env.MAIL_USER, pass: process.env.MAIL_PASSWORD }
            });
            client.connect()
              .then(() => client.logout())
              .then(() => process.exit(0))
              .catch((err) => { console.error('Yandex connection failed:', err.message); process.exit(1); });
          "
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

      # --- Шаг 2: основная сборка — с Яндекс.Почты ---
      - name: Собрать страницы из Яндекс.Почты
        if: steps.check_yandex.outcome == 'success'
        run: node src/build.js --source=mail --encrypt
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
          PLANS_JSON: ${{ vars.PLANS_JSON }}

      # --- Шаг 3: резервная сборка — с Gmail ---
      - name: Собрать страницы из Gmail (резерв)
        if: steps.check_yandex.outcome == 'failure'
        run: node src/build.js --source=mail --encrypt
        env:
          MAIL_USER: ${{ secrets.GMAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
          PLANS_JSON: ${{ vars.PLANS_JSON }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
