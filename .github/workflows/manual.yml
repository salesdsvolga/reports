name: Ручная загрузка отчётов

# Запасной вариант, когда обе почты недоступны.
# Запускается сам при загрузке manual.enc в корень репозитория
# и вручную кнопкой Run workflow (там можно включить force).
on:
  push:
    branches: [main]
    paths:
      - manual.enc
  workflow_dispatch:
    inputs:
      force:
        description: 'Собрать из manual.enc, даже если почта работает'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read   # найти зависшую публикацию страниц

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # --- Шаг 1: проверяем почты (сначала Gmail, Яндекс — только если Gmail не ответил) ---
  check:
    runs-on: ubuntu-latest
    outputs:
      mail_works: ${{ steps.result.outputs.mail_works }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить Gmail
        id: check_gmail
        continue-on-error: true
        run: |
          node -e "
            const { ImapFlow } = require('imapflow');
            const client = new ImapFlow({
              host: 'imap.gmail.com', port: 993, secure: true,
              auth: { user: process.env.MAIL_USER, pass: process.env.MAIL_PASSWORD }
            });
            client.connect().then(() => client.logout()).then(() => process.exit(0))
              .catch((err) => { console.error('Gmail failed:', err.message); process.exit(1); });
          "
        env:
          MAIL_USER: ${{ secrets.GMAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Проверить Яндекс.Почту (только если Gmail не ответил)
        id: check_yandex
        if: steps.check_gmail.outcome != 'success'
        continue-on-error: true
        run: |
          node -e "
            const { ImapFlow } = require('imapflow');
            const client = new ImapFlow({
              host: 'imap.yandex.ru', port: 993, secure: true,
              auth: { user: process.env.MAIL_USER, pass: process.env.MAIL_PASSWORD }
            });
            client.connect().then(() => client.logout()).then(() => process.exit(0))
              .catch((err) => { console.error('Yandex failed:', err.message); process.exit(1); });
          "
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}

      - name: Решение — запускать ли ручную сборку
        id: result
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "⚙️ Форс-режим: почта игнорируется, ручная сборка будет запущена."
            echo "mail_works=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.check_gmail.outcome }}" = "success" ] || [ "${{ steps.check_yandex.outcome }}" = "success" ]; then
            echo "✅ Хотя бы одна почта работает — ручная сборка НЕ запускается."
            echo "   Gmail:  ${{ steps.check_gmail.outcome }}"
            echo "   Яндекс: ${{ steps.check_yandex.outcome }}"
            echo "   Страницы на сайте не тронуты. Если всё же нужно собрать вручную —"
            echo "   запустите workflow через Run workflow с включённой опцией force."
            echo "mail_works=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Обе почты недоступны — запускаю сборку из manual.enc."
            echo "mail_works=false" >> "$GITHUB_OUTPUT"
          fi

  # --- Шаг 2: ручная сборка. Только если обе почты недоступны (или force) ---
  build:
    needs: check
    if: needs.check.outputs.mail_works == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать страницы из manual.enc
        run: node manual.js
        env:
          MANUAL_PASSWORD: ${{ secrets.MANUAL_PASSWORD }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
          PLANS_JSON: ${{ vars.PLANS_JSON }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # --- Шаг 3: публикация. Только если сборка реально была ---
  deploy:
    needs: [check, build]
    if: needs.check.outputs.mail_works == 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub публикует страницы по очереди. Если предыдущая публикация зависла
      # («in progress deployment»), новая не проходит. Запуски идут строго друг за другом
      # (concurrency: pages), поэтому всё, что сейчас числится «в процессе», — зависшее: снимаем.
      - name: Снять зависшие публикации
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for sha in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=15" --jq '.[].sha' | sort -u); do
            st=$(gh api "repos/$REPO/pages/deployments/$sha" --jq '.status' 2>/dev/null || true)
            case "$st" in
              ""|succeed|deployment_cancelled|deployment_failed|deployment_content_failed|deployment_lost|deployment_attempt_error) ;;
              *) echo "Зависшая публикация $sha (статус $st) — отменяю"; gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" || true ;;
            esac
          done

      - id: deployment
        uses: actions/deploy-pages@v4
