<!DOCTYPE html>
<!--
  Окно ввода пароля (staticrypt) в стиле страниц отчётов (template.html):
  те же цвета, шрифты, шапка с логотипом и переключатель темы (общий ключ dv_theme).
  Значения вида /*[|имя|]*/0 подставляет staticrypt при шифровании — не трогать.
-->
<html lang="ru" class="staticrypt-html">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>/*[|template_title|]*/0</title>

<!-- не кэшировать страницу: после пересборки всегда приходит свежая -->
<meta http-equiv="cache-control" content="max-age=0">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT">
<meta http-equiv="pragma" content="no-cache">

<script>
  // тема до отрисовки, чтобы не мигало: та же настройка, что на страницах отчётов
  try{ if(localStorage.getItem('dv_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); }catch(e){}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --bg-2: #0b0b0b;
    --panel: #0d0d0d;
    --panel-2: #1a1a1a;
    --line: #3a3a3a;
    --ink: #ffffff;
    --ink-dim: #b0b0b0;
    --ink-faint: #726c6c;
    --amber: #ffffff;
    --amber-ink: #000000;
    --miss: #ff3b3b;
    --radius: 12px;
    --radius-sm: 10px;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  :root[data-theme="light"]{
    --bg: #f2f2f2;
    --bg-2: #e8e8e8;
    --panel: #ffffff;
    --panel-2: #f5f5f5;
    --line: #d0d0d0;
    --ink: #000000;
    --ink-dim: #555555;
    --ink-faint: #8a8a8a;
    --amber: #000000;
    --amber-ink: #ffffff;
    --miss: #d41f1f;
    color-scheme: light;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(1200px 800px at 50% -10%, var(--bg-2), var(--bg) 60%);
    color: var(--ink);
    font-family: 'Circe','Manrope', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 560px;
    margin: 0 auto;
    padding: 18px 16px 48px;
    min-height: 100vh;
  }

  /* шапка — как на страницах отчётов, чтобы после входа ничего не прыгало */
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 6px 2px 20px;
  }
  .logo{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    font-family:'Uni Sans','Montserrat',Arial,sans-serif;
    font-weight:800;
    font-size:25px;
    line-height:1;
    letter-spacing:.04em;
    text-transform:uppercase;
    color: var(--ink);
  }
  .logo span{
    margin-top:5px;
    padding-left:.75em;
    font-size:7px;
    font-weight:600;
    letter-spacing:.75em;
  }
  .icon-btn{
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink-dim);
    width: 38px; height: 38px;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex: 0 0 auto;
    padding: 0;
  }
  .icon-btn svg{ width:18px; height:18px; }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .panel h1{
    font-family:'Uni Sans','Montserrat',Arial,sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    margin: 0 0 14px;
    line-height: 1.3;
    color: var(--ink);
  }
  .panel h1 small{
    display:block;
    font-family:'Circe','Manrope',Arial,sans-serif;
    font-weight:500;
    font-size: 12.5px;
    color: var(--ink-faint);
    margin-top:2px;
  }

  .field{ position: relative; }
  .field input{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 16px;
    font-family:'Circe','Manrope',Arial,sans-serif;
    padding: 13px 46px 13px 14px;
    border-radius: var(--radius-sm);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .field input::placeholder{ color: var(--ink-faint); }
  .field input:focus{ border-color: var(--amber); }
  .field.error input{ border-color: var(--miss); }
  .eye{
    position:absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    width: 32px; height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding: 0;
  }
  .eye svg{ width:18px; height:18px; }

  .msg{
    min-height: 0;
    margin: 8px 2px 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--miss);
  }
  .msg:empty{ display:none; }

  .remember{
    display:flex;
    align-items:center;
    gap: 10px;
    margin: 14px 2px 2px;
    font-size: 13px;
    color: var(--ink-dim);
    cursor: pointer;
    user-select: none;
  }
  .remember input{
    -webkit-appearance: none;
    appearance: none;
    flex: 0 0 auto;
    width: 20px; height: 20px;
    margin: 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel-2);
    display:grid; place-content:center;
    cursor: pointer;
  }
  .remember input::after{
    content: "";
    width: 10px; height: 6px;
    margin-top: -2px;
    border-left: 2px solid var(--amber-ink);
    border-bottom: 2px solid var(--amber-ink);
    transform: rotate(-45deg) scale(0);
    transition: transform .12s ease;
  }
  .remember input:checked{ background: var(--amber); border-color: var(--amber); }
  .remember input:checked::after{ transform: rotate(-45deg) scale(1); }
  .remember input:focus-visible{ outline: 2px solid var(--amber); outline-offset: 2px; }

  .submit{
    width: 100%;
    margin-top: 16px;
    border: 1px solid var(--amber);
    background: var(--amber);
    color: var(--amber-ink);
    font-family:'Circe','Manrope',Arial,sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 13px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .submit:active{ opacity: .85; }
  .submit:disabled{ opacity: .6; cursor: default; }

  .note{
    text-align:center;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink-faint);
    margin-top: 18px;
  }

  .loading{
    display:flex;
    justify-content:center;
    padding: 48px 0;
  }
  .spinner{
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--line);
    border-top-color: var(--ink);
    animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  @keyframes shake{
    20%{ transform: translateX(-5px); } 40%{ transform: translateX(5px); }
    60%{ transform: translateX(-3px); } 80%{ transform: translateX(3px); }
  }
  .shake{ animation: shake .3s ease; }
  @media (prefers-reduced-motion: reduce){ .shake{ animation: none; } .spinner{ animation-duration: 2s; } }

  .hidden{ display:none !important; }
</style>
</head>
<body class="staticrypt-body">
<div class="wrap">

  <header class="top">
    <div class="logo">DS-VOLGA <span>REPORTS</span></div>
    <button class="icon-btn" id="themeBtn" type="button" title="Тема" aria-label="Переключить тему">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    </button>
  </header>

  <!-- пока проверяется сохранённый пароль -->
  <div id="staticrypt_loading" class="loading" aria-label="Загрузка"><div class="spinner"></div></div>

  <main id="staticrypt_content" class="hidden">
    <section class="panel">
      <h1>/*[|template_title|]*/0<small>/*[|template_instructions|]*/0</small></h1>

      <form id="staticrypt-form" action="#" method="post" novalidate>
        <div class="field" id="pwField">
          <input id="staticrypt-password" type="password" name="password" placeholder="/*[|template_placeholder|]*/0"
                 autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
          <button class="eye" id="eyeBtn" type="button" aria-label="/*[|template_toggle_show|]*/0" title="/*[|template_toggle_show|]*/0">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg>
          </button>
        </div>
        <div class="msg" id="pwMsg" role="alert" aria-live="assertive"></div>

        <label id="staticrypt-remember-label" class="remember hidden">
          <input id="staticrypt-remember" type="checkbox" name="remember">
          /*[|template_remember|]*/0
        </label>

        <button class="submit" id="submitBtn" type="submit">/*[|template_button|]*/0</button>
      </form>
    </section>
    <div class="note">Страница отчёта зашифрована и открывается только с паролем</div>
  </main>

</div>

<script>
  // эти значения подставляет staticrypt при шифровании (формат '/*[|имя|]*/0')
  const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
  const templateError = "/*[|template_error|]*/0",
    templateToggleAltShow = "/*[|template_toggle_show|]*/0",
    templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
    templateButton = "/*[|template_button|]*/0",
    isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
    staticryptConfig = /*[|staticrypt_config|]*/ 0;

  const templateConfig = {
    rememberExpirationKey: "staticrypt_expiration",
    rememberPassphraseKey: "staticrypt_passphrase",
    replaceHtmlCallback: null,
    clearLocalStorageCallback: null,
  };

  const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

  // ---------- тема (общая со страницами отчётов) ----------
  (function(){
    var root = document.documentElement;
    var icon = document.getElementById('themeIcon');
    var SUN = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>';
    var MOON = '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"></path>';
    function apply(t){
      if(t === 'light'){ root.setAttribute('data-theme', 'light'); icon.innerHTML = MOON; }
      else { root.removeAttribute('data-theme'); icon.innerHTML = SUN; }
    }
    apply(root.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
    document.getElementById('themeBtn').addEventListener('click', function(){
      var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      apply(next);
      try{ localStorage.setItem('dv_theme', next); }catch(e){}
    });
  })();

  // ---------- показать / скрыть пароль ----------
  const pwInput = document.getElementById('staticrypt-password');
  const eyeBtn = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  const EYE = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle>';
  const EYE_OFF = '<path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.2 3.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"></path>';
  eyeIcon.innerHTML = EYE_OFF;
  eyeBtn.addEventListener('click', function(){
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    eyeIcon.innerHTML = show ? EYE : EYE_OFF;
    const label = show ? templateToggleAltHide : templateToggleAltShow;
    eyeBtn.setAttribute('aria-label', label);
    eyeBtn.title = label;
    pwInput.focus();
  });

  // ---------- ошибка ввода ----------
  const pwField = document.getElementById('pwField');
  const pwMsg = document.getElementById('pwMsg');
  const submitBtn = document.getElementById('submitBtn');
  function showError(text){
    pwMsg.textContent = text;
    pwField.classList.add('error');
    pwField.classList.remove('shake');
    void pwField.offsetWidth; // перезапуск анимации
    pwField.classList.add('shake');
    pwInput.focus();
    pwInput.select();
  }
  pwInput.addEventListener('input', function(){
    pwMsg.textContent = '';
    pwField.classList.remove('error');
  });

  // ---------- автоматический вход по сохранённому паролю ----------
  window.onload = async function () {
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
    // если страница не расшифровалась сама — показываем форму
    if (!isSuccessful) {
      document.getElementById('staticrypt_loading').classList.add('hidden');
      document.getElementById('staticrypt_content').classList.remove('hidden');
      pwInput.focus();
      if (isRememberEnabled) {
        document.getElementById('staticrypt-remember-label').classList.remove('hidden');
      }
    }
  };

  // ---------- вход ----------
  document.getElementById('staticrypt-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const password = pwInput.value;
    if (!password) { showError('Введите пароль'); return; }
    const isRememberChecked = document.getElementById('staticrypt-remember').checked;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Открываю…';
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
    // при успехе страница уже заменена отчётом
    if (!isSuccessful) {
      submitBtn.disabled = false;
      submitBtn.textContent = templateButton;
      showError(templateError);
    }
  });
</script>
</body>
</html>
